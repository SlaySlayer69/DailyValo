name: Release

# Publishes a GitHub Release with the built APKs.
#
# Two ways in, and they are the same job:
#   * push a tag like v2.1.0            — the PC path, one `git push --tags`
#   * Actions ▸ Release ▸ Run workflow  — the phone path, no checkout needed
#
# The body of the release is the matching section of CHANGELOG.md.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v2.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          # The changelog lives on the default branch and may have gained the
          # entry for this version after the tag was cut.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          # Pinned rather than read from pubspec.yaml, which carries only a Dart
          # constraint. Every version in tool/versions.tsv was built with this.
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the version matches the tag
        run: |
          declared=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "$declared" != "${{ steps.version.outputs.number }}" ]; then
            echo "::error::pubspec.yaml says $declared but the tag says \
          ${{ steps.version.outputs.number }}. Bump one of them."
            exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Absent secrets fall through to the debug key. That build installs and
      # runs, but cannot upgrade an install signed by any other machine, so the
      # release says so rather than shipping a silent trap.
      - name: Unpack the signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; falling back \
          to the debug key. See docs/RELEASING.md."
          else
            echo "$KEYSTORE" | base64 -d > "${{ runner.temp }}/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Name the APKs after the version
        id: apks
        run: |
          v="${{ steps.version.outputs.number }}"
          src=build/app/outputs/flutter-apk
          mkdir -p dist
          cp "$src/app-arm64-v8a-release.apk"   "dist/DailyValo-$v-arm64-v8a.apk"
          cp "$src/app-armeabi-v7a-release.apk" "dist/DailyValo-$v-armeabi-v7a.apk"
          cp "$src/app-release.apk"             "dist/DailyValo-$v-universal.apk"
          ls -lh dist

      - name: Pull this version's section out of the changelog
        id: notes
        run: |
          tag="${{ steps.version.outputs.tag }}"
          # Everything between this version's heading and the next one.
          git show "origin/${{ github.event.repository.default_branch }}:CHANGELOG.md" > /tmp/changelog.md 2>/dev/null \
            || cp CHANGELOG.md /tmp/changelog.md
          awk -v tag="## $tag" '
            $0 == tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' /tmp/changelog.md > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            echo "No changelog entry for $tag." > /tmp/notes.md
          fi

          {
            echo
            echo '### Which file do I want?'
            echo
            echo '| File | For |'
            echo '| --- | --- |'
            echo '| `arm64-v8a` | Almost every current Android phone |'
            echo '| `armeabi-v7a` | Older 32-bit devices |'
            echo '| `universal` | Works everywhere, roughly 3× the size |'
          } >> /tmp/notes.md

          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            {
              echo
              echo '> ⚠️ Built without a release keystore, so this APK is'
              echo '> debug-signed. Android will refuse to install it over an'
              echo '> existing DailyValo — uninstall first, which clears your'
              echo '> wishlist.'
            } >> /tmp/notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DailyValo ${{ steps.version.outputs.tag }}
          body_path: /tmp/notes.md
          files: dist/*.apk
          make_latest: true
