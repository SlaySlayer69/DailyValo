name: Release

# Publishes a GitHub Release with the built APKs.
#
# Two ways in, and they are the same job:
#   * push a tag like v2.1.0            — the PC path, one `git push --tags`
#   * Actions ▸ Release ▸ Run workflow  — the phone path, no checkout needed
#
# The body of the release is the matching section of CHANGELOG.md.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v2.1.0'
        required: true
        type: string
      allow_debug_signing:
        description: >-
          Publish a test build when no signing key is configured. Leave this off
          for a normal release: a debug-signed APK is signed with a key the CI
          runner generates on the spot, so every build is a different app to
          Android and none of them can update the last one. Turning it on says
          "this one is only for trying something out".
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      # Checks out the default branch, not the tag: on a manual run the tag
      # usually does not exist yet, and asking for it here fails the job before
      # anything can create it. The next step tags and then moves onto it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deliberately before the tag is created: a mistyped version on a manual
      # run would otherwise leave a stray tag behind on a job that then failed,
      # and the second attempt would "already exist" pointing at nothing useful.
      - name: Check the version matches the tag
        run: |
          tag='${{ steps.version.outputs.tag }}'

          # From the tag when it exists, from the commit about to be tagged
          # when it does not.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git show "$tag:pubspec.yaml" > /tmp/pubspec.yaml
          else
            cp pubspec.yaml /tmp/pubspec.yaml
          fi

          declared=$(grep '^version:' /tmp/pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "$declared" != "${{ steps.version.outputs.number }}" ]; then
            echo "::error::pubspec.yaml says $declared but the tag says \
          ${{ steps.version.outputs.number }}. Bump one of them."
            exit 1
          fi

      - name: Tag this commit if the tag does not exist yet
        run: |
          tag='${{ steps.version.outputs.tag }}'

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; releasing exactly that commit."
          else
            # Manual runs are the whole point of the phone path: pick a version,
            # press the button. Cutting the tag here is what makes that work
            # without a machine with git on it.
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" -m "DailyValo $tag"
            git push origin "refs/tags/$tag"
            echo "tagged $(git rev-parse --short HEAD) as $tag"
          fi

          # Build from the tag either way, so a release is always exactly what
          # its tag points at — even if the branch moved on in the meantime.
          git checkout --detach "$tag"

      - uses: subosito/flutter-action@v2
        with:
          # Pinned rather than read from pubspec.yaml, which carries only a Dart
          # constraint. Every version in tool/versions.tsv was built with this.
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # A missing keystore is a hard stop unless the run explicitly asked for a
      # test build. The old behaviour — quietly falling back to the debug key —
      # published APKs that cannot update each other, because the runner
      # generates a fresh debug key per job. That is fine for trying something
      # out and useless as a release, so it has to be a deliberate choice.
      - name: Unpack the signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "${{ runner.temp }}/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "signed=false" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.allow_debug_signing }}" = "true" ]; then
            echo "::warning::No signing key — building a debug-signed test \
          build because this run asked for one."
          else
            echo "::error::No signing key configured, so this build could only \
          be debug-signed — which cannot update any other install. Run the \
          'Generate a signing key' workflow once (see docs/RELEASING.md), or \
          re-run this with 'Publish a test build' ticked."
            exit 1
          fi

      - name: Build the APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Name the APKs after the version
        id: apks
        run: |
          v="${{ steps.version.outputs.number }}"
          src=build/app/outputs/flutter-apk
          mkdir -p dist
          cp "$src/app-arm64-v8a-release.apk"   "dist/DailyValo-$v-arm64-v8a.apk"
          cp "$src/app-armeabi-v7a-release.apk" "dist/DailyValo-$v-armeabi-v7a.apk"
          cp "$src/app-release.apk"             "dist/DailyValo-$v-universal.apk"
          ls -lh dist

      - name: Pull this version's section out of the changelog
        id: notes
        run: |
          tag="${{ steps.version.outputs.tag }}"
          # Everything between this version's heading and the next one.
          git show "origin/${{ github.event.repository.default_branch }}:CHANGELOG.md" > /tmp/changelog.md 2>/dev/null \
            || cp CHANGELOG.md /tmp/changelog.md
          awk -v tag="## $tag" '
            $0 == tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' /tmp/changelog.md > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            echo "No changelog entry for $tag." > /tmp/notes.md
          fi

          {
            echo
            echo '### Which file do I want?'
            echo
            echo '| File | For |'
            echo '| --- | --- |'
            echo '| `arm64-v8a` | Almost every current Android phone |'
            echo '| `armeabi-v7a` | Older 32-bit devices |'
            echo '| `universal` | Works everywhere, roughly 3× the size |'
          } >> /tmp/notes.md

          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            {
              echo
              echo '> ### ⚠️ Test build'
              echo '>'
              echo '> No signing key was configured, so this APK is signed with'
              echo '> a throwaway key the build runner generated. Android'
              echo '> identifies an app by its key, so this build cannot'
              echo '> install over any other DailyValo — uninstall first, which'
              echo '> clears your wishlist and collection cache.'
              echo '>'
              echo '> Not a normal release. See `docs/RELEASING.md`.'
            } >> /tmp/notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DailyValo ${{ steps.version.outputs.tag }}
          body_path: /tmp/notes.md
          files: dist/*.apk
          make_latest: true
